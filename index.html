<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maledicta | Registro de personaje</title>
    <meta name="description" content="Constructor de personajes del mundo de fantasía Maledicta." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">
            <img src="./assets/maledicta-logo.png" alt="" hidden onload="this.hidden = false; this.nextElementSibling.hidden = true;" onerror="this.hidden = true; this.nextElementSibling.hidden = false;" />
            <span>M</span>
          </div>
          <div class="brand-copy">
            <p class="eyebrow">Constelación de lo prohibido</p>
            <h1>MALEDICTA</h1>
          </div>
        </div>

        <div class="progress-block">
          <div class="progress-meta">
            <span>Creación de personaje</span>
            <strong id="progress-indicator">0%</strong>
          </div>
          <div class="progress-track">
            <span id="progress-fill"></span>
          </div>
        </div>

        <nav id="step-nav" class="step-nav" aria-label="Navegación del personaje"></nav>
      </aside>

      <main class="main-panel">
        <div id="status-banner" class="status-banner hidden" aria-live="polite"></div>
        <section id="step-content" class="step-content"></section>
        <footer id="action-bar" class="action-bar"></footer>
      </main>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
