<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 196" role="img" aria-labelledby="title">
  <title id="title">Oni de Maledicta con cuatro colas y dos cuernos</title>
  <defs>
    <linearGradient id="skin" x2=".8" y2="1"><stop stop-color="#f17b62"/><stop offset=".48" stop-color="#b83d43"/><stop offset="1" stop-color="#592b3c"/></linearGradient>
    <linearGradient id="armor" x2="0" y2="1"><stop stop-color="#7b4351"/><stop offset="1" stop-color="#302536"/></linearGradient>
    <linearGradient id="horn" x2=".7" y2="1"><stop stop-color="#fff0c9"/><stop offset=".62" stop-color="#c5a77d"/><stop offset="1" stop-color="#684a4b"/></linearGradient>
    <linearGradient id="tail" x2=".8" y2="1"><stop stop-color="#ef8664"/><stop offset=".52" stop-color="#bd4244"/><stop offset="1" stop-color="#633047"/></linearGradient>
    <linearGradient id="mask" x2="0" y2="1"><stop stop-color="#f0c39a"/><stop offset="1" stop-color="#bb7e72"/></linearGradient>
    <filter id="sticker" x="-30%" y="-25%" width="160%" height="155%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="outline"/>
      <feFlood flood-color="#fff0df" result="color"/><feComposite in="color" in2="outline" operator="in" result="border"/>
      <feMerge><feMergeNode in="border"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .tail-one { transform-origin: 64px 140px; animation: tail-one 2.7s ease-in-out infinite; }
      .tail-two { transform-origin: 71px 145px; animation: tail-two 3.1s ease-in-out infinite; }
      .tail-three { transform-origin: 91px 145px; animation: tail-three 2.9s ease-in-out infinite; }
      .tail-four { transform-origin: 103px 139px; animation: tail-four 3.3s ease-in-out infinite; }
      .body { transform-origin: 88px 143px; animation: breathe 3s ease-in-out infinite; }
      @keyframes tail-one { 0%,100% { transform: rotate(0) } 50% { transform: rotate(-8deg) } }
      @keyframes tail-two { 0%,100% { transform: rotate(0) } 50% { transform: rotate(7deg) } }
      @keyframes tail-three { 0%,100% { transform: rotate(0) } 50% { transform: rotate(-7deg) } }
      @keyframes tail-four { 0%,100% { transform: rotate(0) } 50% { transform: rotate(9deg) } }
      @keyframes breathe { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-1.5px) } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </defs>
  <g filter="url(#sticker)" stroke="#211823" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Four separate animated tails -->
    <g class="tail-one"><path fill="url(#tail)" d="M66 144q-30-13-42-34-9-16-2-26 8 12 18 13-7-13-3-24 13 11 15 23 14 17 26 16l5 22z"/><path fill="#f3bd83" stroke-width="2" d="m23 84 8 10-10 1m21-9 5 10-8-2"/></g>
    <g class="tail-two"><path fill="url(#tail)" d="M75 148q-22-3-40-18-14-12-11-25 10 8 19 6-10-10-9-21 15 7 21 18 15 9 27 4l8 24z"/><path fill="#f3bd83" stroke-width="2" d="m28 109 11 5-9 4m15-22 8 9-9-1"/></g>
    <g class="tail-three"><path fill="url(#tail)" d="M96 148q22-3 40-18 14-12 11-25-10 8-19 6 10-10 9-21-15 7-21 18-15 9-27 4l-8 24z"/><path fill="#f3bd83" stroke-width="2" d="m148 109-11 5 9 4m-15-22-8 9 9-1"/></g>
    <g class="tail-four"><path fill="url(#tail)" d="M105 144q30-13 42-34 9-16 2-26-8 12-18 13 7-13 3-24-13 11-15 23-14 17-26 16l-5 22z"/><path fill="#f3bd83" stroke-width="2" d="m157 84-8 10 10 1m-21-9-5 10 8-2"/></g>
    <g class="body">
      <!-- Legs and ceremonial armor -->
      <path fill="#392b38" d="m62 152-7 21q-2 7 6 8h20l5-7-9-8 5-15m26 0 5 15-6 8 6 7h20q8-1 4-8l-13-21"/>
      <path fill="url(#skin)" d="m62 166 15 2 6 7H62q-6-2 0-9m47 0 14-1 8 9h-18q-6-2-4-8"/>
      <path fill="url(#armor)" d="M59 101q-15 7-17 26l-5 26q14 11 33 4l16-18 16 18q18 5 34-7l-10-28q-6-17-21-21z"/>
      <path fill="#a16f62" d="m51 122 13 4-7 20-14-2m54-21 13-3 11 20-15 6z"/>
      <path fill="#c7a77a" d="m69 113 18 8 18-8 9 11-8 28-19 8-20-10-7-27z"/>
      <path fill="#713440" d="m79 124 8 7 8-7-3 17-5 8-5-8z"/>
      <path fill="none" stroke="#f2d69f" stroke-width="2" d="m51 137 12 4m38-2 13-5M60 151l13 3m28 0 13-3"/>
      <!-- Arms, cuffs and claws -->
      <path fill="url(#skin)" d="m50 112-17 12q-7 7-1 14l16 9 8-8-11-9 15-7m61-12 17 12q7 7 1 14l-16 9-8-8 11-9-15-7"/>
      <path fill="url(#horn)" d="m34 131 13 1 5 9-8 7-13-6m108-11-13 1-5 9 8 7 13-6"/>
      <path fill="#d2a55f" d="m40 132 10 2 3 6-8 5-8-5m93-8 10-2 3 8-8 5-8-5"/>
      <!-- Neck and head -->
      <path fill="url(#skin)" d="m74 97 1 17q12 10 26 0l2-20z"/>
      <path fill="url(#skin)" d="M46 69q-5-24 8-40l-1-18 17 11Q82 3 99 10l13-8 2 19q21-2 29 18l12 5-10 12q5 19-4 35l-13 20q-11 7-18-2l-54-4-15-18z"/>
      <!-- Horns -->
      <path fill="url(#horn)" d="M58 41Q43 30 39 15q12 8 21 2l10 17m48 7q16-10 20-26-12 8-21 2l-10 19"/>
      <path fill="none" stroke="#fff0c9" stroke-width="2" d="m44 19 13 16m75-15-13 16"/>
      <!-- Ears -->
      <path fill="url(#skin)" d="M51 62Q34 51 30 62l12 19 12-6m74-13q17-11 21 0l-12 19-12-6"/>
      <!-- Hannya-inspired carved mask -->
      <path fill="url(#mask)" d="M58 43q28-16 57 0l8 25q-3 29-34 39-29-8-36-35z"/>
      <path fill="#60303a" d="m59 61 19 5-9 10-12-3m50-12-19 5 9 10 12-3"/>
      <path fill="#fff1d7" d="m63 62 12 3-7 6zm40 0-12 3 7 6z" stroke-width="1.5"/>
      <circle cx="69" cy="67" r="2.2" fill="#db564b" stroke="none"/><circle cx="96" cy="67" r="2.2" fill="#db564b" stroke="none"/>
      <path fill="none" stroke="#54303a" stroke-width="2.7" d="m58 57 13-5 11 7m7-1 12-6 13 5"/>
      <path fill="#71313c" d="m84 70 6 0-3 8z"/>
      <path fill="#552c37" d="M72 84q17 8 34-1l-5 12q-12 8-23 0z"/>
      <path fill="#fff0d6" stroke-width="1.4" d="m76 86 6 2-1 7-5-2zm21 0 5-2 1 7-5 3z"/>
      <path fill="none" stroke="#e4b79a" stroke-width="2" d="m55 77 9 3m56-3-9 3"/>
      <!-- Forehead seal and ornaments -->
      <path fill="none" stroke="#e7c384" stroke-width="4" d="M65 43q21 10 44 0"/>
      <path fill="#d6ae6e" d="m83 38 7-8 7 8-7 9z" stroke-width="2"/>
      <path fill="none" stroke="#e6c386" stroke-width="2" d="M87 36v8m5-8v8"/>
      <!-- Belt, beads and talismans -->
      <path fill="none" stroke="#d7ae75" stroke-width="5" d="M46 151q39 13 86-1"/>
      <path fill="#ad7550" d="m79 151 10-5 11 5-3 12-11 4-9-7z"/>
      <path fill="#f3d9aa" d="m105 151 12-5 2 19-10 6z"/>
      <path fill="none" stroke="#7f3b42" stroke-width="2" d="m108 155 7 5m-6 1 6 4"/>
    </g>
  </g>
</svg>
